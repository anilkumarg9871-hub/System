<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#040711">
<title>PERSONAL SYSTEM</title>
<style>
:root{--bg:#03050c;--panel:rgba(6,15,31,.84);--line:#164b68;--cyan:#61eaff;--blue:#168cff;--purple:#8b5cf6;--text:#dff8ff;--muted:#7695aa;--good:#6fffc1;--danger:#ff668e}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#03050c;color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow-x:hidden}
#space{position:fixed;inset:0;z-index:0;overflow:hidden;background:
radial-gradient(circle at 50% -5%,#123b70 0,transparent 35%),
radial-gradient(circle at 10% 45%,#26104d 0,transparent 30%),
radial-gradient(circle at 95% 70%,#003e59 0,transparent 28%),
linear-gradient(#02040a,#050814 50%,#01030a)}
#space:before{content:"";position:absolute;inset:-30%;background:
linear-gradient(rgba(75,215,255,.045) 1px,transparent 1px),
linear-gradient(90deg,rgba(75,215,255,.045) 1px,transparent 1px);background-size:42px 42px;transform:perspective(600px) rotateX(58deg) translateY(25%);animation:grid 18s linear infinite}
#space:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(90,220,255,.018) 4px,transparent 5px);mix-blend-mode:screen}
.orb{position:absolute;border-radius:50%;filter:blur(35px);opacity:.2;animation:orb 12s ease-in-out infinite alternate}
.o1{width:260px;height:260px;background:#008cff;left:-100px;top:18%}.o2{width:240px;height:240px;background:#7c3aed;right:-80px;top:45%;animation-delay:-4s}.o3{width:180px;height:180px;background:#00e5ff;left:42%;bottom:-60px;animation-delay:-7s}
.particle{position:absolute;width:2px;height:2px;border-radius:50%;background:#70ecff;box-shadow:0 0 8px #00d9ff;animation:rise linear infinite;opacity:.5}
.app{position:relative;z-index:1;min-height:100vh;padding-bottom:92px}
header{position:sticky;top:0;z-index:20;padding:calc(12px + env(safe-area-inset-top)) 15px 11px;background:rgba(2,5,13,.82);backdrop-filter:blur(16px);border-bottom:1px solid #16415b}
.eyebrow{font-size:9px;letter-spacing:.2em;color:var(--cyan)}.brand{font-size:15px;font-weight:900;letter-spacing:.16em;margin-top:4px}
main{width:min(820px,100%);margin:auto;padding:12px}
.panel{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(8,19,39,.9),rgba(3,8,19,.82));border:1px solid #174d6b;border-radius:16px;padding:15px;margin-bottom:12px;box-shadow:0 0 28px #007eff0e,inset 0 0 30px #7c3aed09}
.panel:before{content:"";position:absolute;left:-100%;top:0;width:60%;height:100%;background:linear-gradient(90deg,transparent,#64eaff0a,transparent);animation:sweep 7s ease-in-out infinite;pointer-events:none}
.panel:after{content:"";position:absolute;left:15px;right:15px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--cyan),transparent);opacity:.4}
.systemline,.section-title{font-size:10px;letter-spacing:.18em;color:var(--cyan)}.section-title{margin-bottom:12px}
.hero{text-align:center;padding:22px 14px}.welcome{font-size:12px;letter-spacing:.18em;color:#a6dff0}
.arise{margin:19px auto;width:min(350px,92%);padding:19px;border-radius:15px;border:1px solid var(--cyan);background:linear-gradient(180deg,#082542,#061221);color:#eaffff;font-weight:950;font-size:25px;letter-spacing:.12em;box-shadow:0 0 30px #00bfff45,inset 0 0 22px #00bfff15;transition:.2s}.arise:active{transform:scale(.97);box-shadow:0 0 45px #00d9ff80}
.status{display:grid;grid-template-columns:1fr 1fr;gap:8px;text-align:left}.stat{padding:11px;border:1px solid #123b56;border-radius:10px;background:#020711aa}.stat small{display:block;color:#69869a;font-size:8px;letter-spacing:.14em}.stat b{display:block;font-size:17px;margin-top:4px}.bar{height:10px;margin:14px 0;border:1px solid #205b7a;border-radius:99px;overflow:hidden;background:#02050a}.bar i{display:block;height:100%;background:linear-gradient(90deg,#008dff,#63f5ff,#8b5cf6);box-shadow:0 0 15px #00bfff;transition:width .5s}.date{font-size:11px;color:var(--muted)}
.quest{border:1px solid #153d59;border-radius:12px;padding:13px;margin:9px 0;background:#020813cc}.qtop{display:flex;justify-content:space-between;gap:8px}.qtop b{font-size:11px}.timer{text-align:center;font-size:38px;font-variant-numeric:tabular-nums;color:#93f3ff;text-shadow:0 0 18px #00cfff;padding:15px 0}.actions{display:flex;gap:7px;flex-wrap:wrap}.btn{flex:1;min-height:42px;border:1px solid #205976;background:#071827;color:#dffaff;border-radius:9px;padding:9px;font-weight:700}.btn.primary{border-color:#38cfff;background:#072641}.btn.good{border-color:#3bce9e;color:#b9ffea}.btn.danger{border-color:#81344e;color:#ff9ab5}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
input,select,textarea{width:100%;background:#020710;border:1px solid #194861;border-radius:9px;color:var(--text);padding:11px}textarea{min-height:115px;resize:vertical}label{display:block;color:#8ca6b6;font-size:10px;letter-spacing:.1em;margin:11px 0}label input[type=checkbox]{width:auto;margin-right:7px}
.task{display:grid;grid-template-columns:38px 1fr auto 28px;gap:6px;align-items:center;padding:10px 0;border-bottom:1px solid #112b3d}.task .check{background:none;border:0;color:var(--cyan);font-size:22px}.task small{color:var(--muted)}.done{text-decoration:line-through;color:#617989}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stats .stat b{font-size:22px;color:#91f1ff}.stats .stat span{font-size:8px;color:#7690a0;letter-spacing:.1em}
.achievement{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:11px;border-bottom:1px solid #122b3e;opacity:.42}.achievement.unlocked{opacity:1}.achievement small{color:var(--good)}
.igris{padding:13px;border:1px solid #245875;border-radius:12px;background:radial-gradient(circle at 50% 0,#123b59,#020811 55%);min-height:75px;line-height:1.6;margin-bottom:10px}
.toast{position:fixed;top:75px;left:50%;transform:translateX(-50%);z-index:50;padding:11px 16px;background:#061a2b;border:1px solid var(--cyan);border-radius:10px;box-shadow:0 0 25px #00bfff55;font-size:12px}
.modal{position:fixed;inset:0;z-index:60;background:#01040beF;display:grid;place-items:center;padding:20px}.modalbox{text-align:center;width:min(500px,95%);padding:30px;border:1px solid var(--cyan);border-radius:20px;background:#061224;box-shadow:0 0 60px #00bfff35}.sigil{font-size:70px;color:var(--cyan);text-shadow:0 0 35px #00d9ff;animation:pulse 1s infinite alternate}.modalbox strong{display:block;font-size:45px;letter-spacing:.1em;margin:8px 0;text-shadow:0 0 25px #00cfff}
nav{position:fixed;z-index:40;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);padding:7px 6px calc(7px + env(safe-area-inset-bottom));background:#020610ed;border-top:1px solid #17445e;backdrop-filter:blur(16px)}nav button{border:0;background:none;color:#6f8999;font-size:8px;letter-spacing:.08em;padding:3px}nav b{display:block;font-size:19px}nav .active{color:#6cecff;text-shadow:0 0 12px #00cfff}
.hidden{display:none}.muted{color:var(--muted);font-size:11px;line-height:1.5}.notice{padding:10px;border:1px solid #294b63;border-radius:9px;background:#06111f;color:#8eacbc;font-size:11px;line-height:1.5}
@keyframes grid{to{background-position:42px 42px}}@keyframes rise{from{transform:translateY(105vh);opacity:0}15%{opacity:.5}to{transform:translateY(-10vh);opacity:0}}@keyframes orb{to{transform:translate(35px,-25px) scale(1.12)}}@keyframes sweep{0%,60%{left:-100%}85%,100%{left:140%}}@keyframes pulse{to{transform:scale(1.08);filter:brightness(1.4)}}@media(min-width:700px){.status{grid-template-columns:repeat(4,1fr)}.stats{grid-template-columns:repeat(4,1fr)}main{padding:22px}}
.reduce *{animation:none!important;transition:none!important}.minimal *{animation-duration:.01ms!important}.off *{animation:none!important}
</style>
</head>
<body>
<div id="space"><div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div><script>
for(let i=0;i<55;i++){let p=document.createElement('i');p.className='particle';p.style.left=Math.random()*100+'%';p.style.animationDuration=(5+Math.random()*10)+'s';p.style.animationDelay=(-Math.random()*12)+'s';p.style.transform=`scale(${.5+Math.random()*1.8})`;document.getElementById('space').appendChild(p)}
</script></div>
<div id="app"></div>
<script>
const KEY='PERSONAL_SYSTEM_FULL_V2';
const DEF={name:'My Liege',level:1,xp:0,streak:0,best:0,lastFull:null,quests:{study:0,exercise:0,gripper:0,manhwa:0},history:[],tasks:[],settings:{grade:'Class 10',hint:true,particles:true,animation:'full',voice:true,autoSpeak:true,speed:.85,pitch:.75,volume:1,sfx:true,master:.75,xp:{study:25,exercise:25,gripper:25,manhwa:25},targets:{study:30,exercise:20,gripper:100,manhwa:10}}};
let S=load(),tab='home',toastTimer,arise=false,igrisReply='',speechRec=null;
function load(){try{return deep({...DEF,...JSON.parse(localStorage.getItem(KEY)||'{}')})}catch{return deep(DEF)}}
function deep(x){return JSON.parse(JSON.stringify(x))}
function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function today(){return new Date().toISOString().slice(0,10)}
function rank(l){return l>=40?'SSS':l>=30?'SS':l>=20?'S':l>=15?'A':l>=10?'B':l>=7?'C':l>=4?'D':'E'}
function need(){return S.level*100}
function notify(x){clearTimeout(toastTimer);document.querySelectorAll('.toast').forEach(e=>e.remove());let d=document.createElement('div');d.className='toast';d.textContent=x;document.body.appendChild(d);toastTimer=setTimeout(()=>d.remove(),2600)}
function speak(x){if(!S.settings.voice||!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(x),vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/en/i.test(v.lang)&&/male|david|daniel|alex|george/i.test(v.name))||vs.find(v=>/en/i.test(v.lang));u.rate=S.settings.speed;u.pitch=S.settings.pitch;u.volume=S.settings.volume;speechSynthesis.speak(u)}
function sfx(freq=440){if(!S.settings.sfx)return;try{let C=AudioContext||webkitAudioContext,c=new C,o=c.createOscillator,g=c.createGain();o=o();g=g();o.frequency.value=freq;g.gain.value=.045*S.settings.master;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.2)}catch{}}
function target(k){return S.settings.targets[k]}
function doneToday(k){return S.history.some(x=>x.date===today()&&x.key===k)}
function complete(k){if(doneToday(k))return;S.quests[k]=target(k);S.history.push({date:today(),key:k});S.xp+=S.settings.xp[k];while(S.xp>=need()){S.xp-=need();S.level++;sfx(720);speak('Level up, '+S.name);notify('⚡ LEVEL UP · '+S.name)}sfx(520);speak('Quest cleared, '+S.name);notify('✓ QUEST CLEARED · +'+S.settings.xp[k]+' XP');checkStreak();save();render()}
function checkStreak(){let req=['study','exercise','gripper','manhwa'];if(req.every(doneToday)&&S.lastFull!==today()){let y=new Date(Date.now()-86400000).toISOString().slice(0,10);S.streak=S.lastFull===y?S.streak+1:1;S.best=Math.max(S.best,S.streak);S.lastFull=today()}}
function setQ(k,d){S.quests[k]=Math.max(0,Math.min(target(k),S.quests[k]+d));if(S.quests[k]>=target(k))complete(k);save();render()}
const timers={study:{sec:0,run:false,last:0},exercise:{sec:0,run:false,last:0}};
setInterval(()=>{let changed=false;for(let k of ['study','exercise']){let t=timers[k];if(t.run){let n=Math.floor((Date.now()-t.last)/1000);if(n){t.sec=Math.max(0,t.sec-n);t.last=Date.now();changed=true;if(t.sec===0){t.run=false;complete(k)}}}}if(changed)render()},500);
function timer(k){let t=timers[k];if(!t.sec)t.sec=target(k)*60;t.run=!t.run;t.last=Date.now();if(t.run){speak('Quest initiated, '+S.name);notify('⚔ QUEST STARTED')}render()}
function resetTimer(k){timers[k]={sec:0,run:false,last:0};render()}
function fmt(n){return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')}
function pageHome(){let p=Math.min(100,S.xp/need()*100);return `<section class="panel hero"><div class="welcome">WELCOME, ${esc(S.name).toUpperCase()}</div><button class="arise" onclick="ariseNow()">⚔ ARISE</button><div class="status"><div class="stat"><small>LEVEL</small><b>${String(S.level).padStart(2,'0')}</b></div><div class="stat"><small>RANK</small><b>${rank(S.level)}</b></div><div class="stat"><small>XP</small><b>${S.xp} / ${need()}</b></div><div class="stat"><small>STREAK</small><b>🔥 ${S.streak} DAYS</b></div></div><div class="bar"><i style="width:${p}%"></i></div><div class="date">${new Date().toLocaleDateString(undefined,{weekday:'long',year:'numeric',month:'long',day:'numeric'})}</div></section><section class="panel"><div class="section-title">⚔ DAILY QUESTS</div>${mini('📚','Study',target('study'),'MIN')}${mini('🏃','Exercise',target('exercise'),'MIN')}${mini('💪','Hand Gripper',target('gripper'),'CLICKS')}${mini('📖','Manhwa',target('manhwa'),'CHAPTERS')}</section><section class="panel"><div class="section-title">🛡 IGRIS — SHADOW AI</div><div class="igris">“Awaiting your command, ${esc(S.name)}.”</div><button class="btn primary" style="width:100%" onclick="tab='igris';render()">🧠 ASK IGRIS</button></section>${tasksHTML()}`}
function mini(i,n,t,u){return `<div class="row" style="padding:12px 4px;border-bottom:1px solid #112a3b" onclick="tab='quests';render()"><span>${i} ${n}</span><b>${t} ${u}</b></div>`}
function pageQuests(){let arr=[['study','📚','STUDY',true],['exercise','🏃','EXERCISE',true],['gripper','💪','HAND GRIPPER',false],['manhwa','📖','MANHWA',false]];return `<section class="panel"><div class="section-title">⚔ DAILY QUESTS</div>${arr.map(a=>{let[k,i,n,timed]=a;return `<div class="quest"><div class="qtop"><span>${i} ${n}</span><b>${S.quests[k]} / ${target(k)} ${timed?'MIN':k==='gripper'?'CLICKS':'CHAPTERS'}</b></div>${timed?`<div class="timer">${fmt(timers[k].sec)}</div><div class="actions"><button class="btn primary" onclick="timer('${k}')">${timers[k].run?'⏸ PAUSE':'▶ START'}</button><button class="btn" onclick="resetTimer('${k}')">↻ RESET</button><button class="btn good" onclick="complete('${k}')">✓ COMPLETE</button></div>`:`<div class="actions"><button class="btn" onclick="setQ('${k}',-1)">−</button><button class="btn" onclick="setQ('${k}',1)">+</button><button class="btn good" onclick="complete('${k}')">✓ COMPLETE</button></div>`}</div>`}).join('')}</section>${tasksHTML()}`}
function tasksHTML(){return `<section class="panel"><div class="section-title">WORK TASKS</div><div class="row"><input id="taskName" placeholder="Task name"><input id="taskDue" type="date"><button class="btn primary" onclick="addTask()">ADD</button></div>${S.tasks.map(t=>`<div class="task"><button class="check" onclick="toggleTask('${t.id}')">${t.done?'✓':'○'}</button><span class="${t.done?'done':''}">${esc(t.name)}</span><small>${t.due||'No due date'}</small><button class="btn" onclick="delTask('${t.id}')">×</button></div>`).join('')}</section>`}
function addTask(){let n=document.getElementById('taskName')?.value.trim();let d=document.getElementById('taskDue')?.value;if(!n)return;S.tasks.push({id:crypto.randomUUID(),name:n,due:d,done:false});save();render()}
function toggleTask(id){let t=S.tasks.find(x=>x.id===id);if(t)t.done=!t.done;save();render()}
function delTask(id){S.tasks=S.tasks.filter(x=>x.id!==id);save();render()}
function pageIgris(){return `<section class="panel"><div class="section-title">🛡 IGRIS — SHADOW AI</div><div class="igris">${igrisReply||`“Awaiting your command, ${esc(S.name)}.”`}</div><textarea id="question" placeholder="Ask a ${S.settings.grade} question..."></textarea><div class="actions"><button class="btn primary" onclick="askIgris()">🧠 ASK IGRIS</button><button class="btn" onclick="voiceInput()">🎤 VOICE</button></div><p class="muted">💡 HINT MODE: <b>${S.settings.hint?'ON':'OFF'}</b></p></section><section class="panel"><div class="section-title">📷 SCAN QUESTION</div><input id="scan" type="file" accept="image/*" capture="environment"><button class="btn primary" style="width:100%;margin-top:8px" onclick="scanQuestion()">SCAN & EXPLAIN</button><p class="notice">Image scanning requires an online AI backend. The standalone file keeps your local System fully functional without sending images anywhere automatically.</p></section>`}
async function askIgris(){let q=document.getElementById('question').value.trim();if(!q)return;igrisReply='Processing, My Liege...';render();try{let r=await fetch('/api/igris/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:q,grade:S.settings.grade,hintMode:S.settings.hint})});let j=await r.json();igrisReply=j.reply||'System connection unavailable, My Liege.'}catch{igrisReply='AI service unavailable in standalone mode, My Liege. The local System remains operational.'}render()}
function scanQuestion(){igrisReply='Scanner ready, My Liege. A hosted vision backend is required for OCR/solving from the selected image.';render()}
function voiceInput(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){notify('Voice input unavailable in this browser');return}speechRec=new R();speechRec.lang='en-US';speechRec.onresult=e=>{document.getElementById('question').value=e.results[0][0].transcript};speechRec.start()}
function pageStats(){let c=S.history.length;let gr=S.history.filter(x=>x.key==='gripper').length*target('gripper'),mh=S.history.filter(x=>x.key==='manhwa').length*target('manhwa');let st=S.history.filter(x=>x.key==='study').length*target('study');return `<section class="panel"><div class="section-title">📊 PLAYER STATUS</div><div class="stats"><div class="stat"><b>${c}</b><span>QUESTS CLEARED</span></div><div class="stat"><b>${S.xp}</b><span>CURRENT XP</span></div><div class="stat"><b>${S.level}</b><span>LEVEL</span></div><div class="stat"><b>${rank(S.level)}</b><span>RANK</span></div><div class="stat"><b>${S.streak}</b><span>CURRENT STREAK</span></div><div class="stat"><b>${S.best}</b><span>BEST STREAK</span></div><div class="stat"><b>${st}</b><span>STUDY MINUTES*</span></div><div class="stat"><b>${gr}</b><span>GRIP CLICKS*</span></div><div class="stat"><b>${mh}</b><span>CHAPTERS*</span></div></div><p class="muted">*Calculated from cleared daily quest targets.</p></section><section class="panel"><div class="section-title">🏆 ACHIEVEMENTS</div>${ach('FIRST QUEST',c>=1)}${ach('7-DAY HUNTER',S.best>=7)}${ach('SCHOLAR',st>=300)}${ach('STRENGTH TRAINING',gr>=500)}${ach('READER',mh>=100)}${ach('LEVEL UP',S.level>=2)}${ach('S-RANK',['S','SS','SSS'].includes(rank(S.level)))}</section>`}
function ach(n,u){return `<div class="achievement ${u?'unlocked':''}"><span>${u?'🏆':'🔒'}</span><b>${n}</b><small>${u?'UNLOCKED':'LOCKED'}</small></div>`}
function pageSettings(){return `<section class="panel"><div class="section-title">⚙ SYSTEM CONTROL CENTER</div><label>PLAYER NAME<input id="pname" value="${esc(S.name)}"></label><label>CLASS / GRADE<select id="grade">${[7,8,9,10,11,12].map(x=>`<option ${S.settings.grade==='Class '+x?'selected':''}>Class ${x}</option>`).join('')}</select></label><label>ANIMATION<select id="anim"><option value="full" ${S.settings.animation==='full'?'selected':''}>FULL</option><option value="minimal" ${S.settings.animation==='minimal'?'selected':''}>MINIMAL</option><option value="off" ${S.settings.animation==='off'?'selected':''}>OFF</option></select></label><label><input id="particles" type="checkbox" ${S.settings.particles?'checked':''}> PARTICLES ON/OFF</label><label><input id="hint" type="checkbox" ${S.settings.hint?'checked':''}> HINT MODE</label><label><input id="voice" type="checkbox" ${S.settings.voice?'checked':''}> IGRIS VOICE</label><label><input id="auto" type="checkbox" ${S.settings.autoSpeak?'checked':''}> AUTO SPEAK</label><label>VOICE SPEED<input id="speed" type="range" min=".5" max="1.5" step=".05" value="${S.settings.speed}"></label><label>VOICE PITCH<input id="pitch" type="range" min=".4" max="1.2" step=".05" value="${S.settings.pitch}"></label><label><input id="sfx" type="checkbox" ${S.settings.sfx?'checked':''}> SFX</label><button class="btn primary" style="width:100%" onclick="testVoice()">TEST IGRIS VOICE</button></section><section class="panel"><div class="section-title">🎯 QUEST TARGETS & XP</div>${['study','exercise','gripper','manhwa'].map(k=>`<label>${k.toUpperCase()} TARGET<input id="t_${k}" type="number" min="1" value="${S.settings.targets[k]}"></label><label>${k.toUpperCase()} XP<input id="x_${k}" type="number" min="0" value="${S.settings.xp[k]}"></label>`).join('')}<button class="btn primary" style="width:100%" onclick="saveSettings()">SAVE SYSTEM SETTINGS</button></section><section class="panel"><div class="section-title">💾 DATA</div><div class="actions"><button class="btn" onclick="exportData()">EXPORT JSON</button><label class="btn" style="text-align:center">IMPORT JSON<input id="import" type="file" accept=".json" style="display:none" onchange="importData(this)"></label></div><button class="btn danger" style="width:100%;margin-top:8px" onclick="resetAll()">RESET EVERYTHING</button></section>`}
function saveSettings(){S.name=document.getElementById('pname').value.trim()||'My Liege';S.settings.grade=document.getElementById('grade').value;S.settings.animation=document.getElementById('anim').value;S.settings.particles=document.getElementById('particles').checked;S.settings.hint=document.getElementById('hint').checked;S.settings.voice=document.getElementById('voice').checked;S.settings.autoSpeak=document.getElementById('auto').checked;S.settings.speed=+document.getElementById('speed').value;S.settings.pitch=+document.getElementById('pitch').value;S.settings.sfx=document.getElementById('sfx').checked;for(let k of ['study','exercise','gripper','manhwa']){S.settings.targets[k]=Math.max(1,+document.getElementById('t_'+k).value);S.settings.xp[k]=Math.max(0,+document.getElementById('x_'+k).value)}save();applyFX();notify('SYSTEM SETTINGS SAVED');render()}
function applyFX(){document.documentElement.className=(S.settings.animation==='minimal'?'minimal ':S.settings.animation==='off'?'off ':'')+(S.settings.particles?'':' noParticles')}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));a.download='personal-system-backup.json';a.click()}
function importData(i){let f=i.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{S=deep({...DEF,...JSON.parse(r.result)});save();render();notify('DATA RESTORED')}catch{notify('Invalid backup file')}};r.readAsText(f)}
function resetAll(){if(confirm('Reset everything, My Liege?')){localStorage.removeItem(KEY);location.reload()}}
function testVoice(){speak('Awaiting your command, '+S.name);sfx(330)}
function ariseNow(){arise=true;sfx(220);speak('System activated. Your quests await, '+S.name);render();setTimeout(()=>{arise=false;render()},1800)}
function esc(x){return String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function render(){let content=tab==='home'?pageHome():tab==='quests'?pageQuests():tab==='igris'?pageIgris():tab==='stats'?pageStats():pageSettings();document.getElementById('app').innerHTML=`<div class="app"><header><div class="eyebrow">SYSTEM ONLINE · ${navigator.onLine?'NETWORK READY':'OFFLINE MODE'}</div><div class="brand">PERSONAL SYSTEM</div></header><main>${content}</main><nav>${[['home','⌂','HOME'],['quests','⚔','QUESTS'],['igris','🛡','IGRIS'],['stats','◫','STATS'],['settings','⚙','SETTINGS']].map(x=>`<button class="${tab===x[0]?'active':''}" onclick="tab='${x[0]}';render()"><b>${x[1]}</b>${x[2]}</button>`).join('')}</nav>${arise?`<div class="modal"><div class="modalbox"><div class="sigil">◈</div><div>SYSTEM ACTIVATED</div><strong>ARISE</strong><div class="muted">Quest interface synchronized, ${esc(S.name)}.</div></div></div>`:''}</div>`;applyFX()}
window.addEventListener('online',()=>notify('SYSTEM CONNECTION RESTORED'));window.addEventListener('offline',()=>notify('OFFLINE MODE · LOCAL SYSTEM ACTIVE'));
render();
</script>
</body>
</html>
